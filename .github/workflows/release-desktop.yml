name: Release Nomos Desktop

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "codex/v0.0.3-release"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    defaults:
      run:
        working-directory: 产品开发/nomos-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 产品开发/nomos-desktop/package-lock.json
      - name: Verify signing credentials
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
      - run: npm ci
      - run: npm run release:check
      - name: Build candidate with ad-hoc signature
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist:mac
      - name: Build, sign and notarize release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build && npx electron-builder --mac dmg zip --arm64 --publish never
      - name: Verify application signature structure
        shell: bash
        run: |
          codesign --verify --deep --strict release/mac-arm64/Nomos.app
      - name: Verify Gatekeeper and notarization
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          spctl --assess --type execute --verbose=2 release/mac-arm64/Nomos.app
          xcrun stapler validate release/mac-arm64/Nomos.app
      - uses: actions/upload-artifact@v4
        with:
          name: nomos-macos
          path: |
            产品开发/nomos-desktop/release/Nomos-*-mac-arm64.dmg
            产品开发/nomos-desktop/release/Nomos-*-mac-arm64.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: cd artifacts && sha256sum Nomos-* > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --verify-tag --generate-notes --title "Nomos ${GITHUB_REF_NAME#v}"
